<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ماتشات العباقرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#15112F;
    --bg-panel:#201A4D;
    --bg-panel-2:#271F5E;
    --gold:#E8B54A;
    --team-a:#22C1B5;
    --team-a-dim:#12403C;
    --team-b:#F2924B;
    --danger:#E5484D;
    --text:#F5F3FC;
    --muted:#9D97C6;
    --line:rgba(245,243,252,0.12);
    --font:'Tajawal', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 15% -10%, #2A2266 0%, transparent 60%),
      radial-gradient(900px 500px at 105% 10%, #2A2266 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:var(--font);
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .app{
    max-width:1180px;
    margin:0 auto;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 22px 26px;
  }

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    display:grid;
    grid-template-columns:1fr minmax(180px,280px) 1fr;
    gap:14px;
    align-items:stretch;
  }
  .team-panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:14px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .team-panel.a{ border-radius:26px 10px 10px 26px; border-inline-start:4px solid var(--team-a); }
  .team-panel.b{ border-radius:10px 26px 26px 10px; border-inline-end:4px solid var(--team-b); }
  .team-name{
    font-weight:700; font-size:15px; color:var(--muted);
    background:transparent; border:none; outline:none; width:100%;
    padding:2px 4px; border-radius:6px;
  }
  .team-panel.a .team-name{color:var(--team-a);}
  .team-panel.b .team-name{color:var(--team-b);}
  .team-name:focus{background:rgba(255,255,255,0.06);}
  .score-row{display:flex;align-items:center;gap:10px;}
  .team-panel.b .score-row{flex-direction:row-reverse;}
  .score-value{
    font-size:44px; font-weight:900; line-height:1;
    background:transparent; border:none; outline:none; color:var(--text);
    width:1.7em; padding:2px 4px; border-radius:8px; text-align:center;
  }
  .score-value:focus{background:rgba(255,255,255,0.08);}
  .score-value::-webkit-outer-spin-button,.score-value::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .score-btns{display:flex;flex-direction:column;gap:4px;}
  .score-btn{
    width:26px;height:22px;border-radius:7px;border:1px solid var(--line);
    background:var(--bg-panel-2);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;line-height:1;
  }
  .score-btn:hover{filter:brightness(1.25);}

  .center-info{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;}
  .round-label{font-weight:800;font-size:15px;color:var(--gold);}
  .round-sub{font-size:12px;color:var(--muted);}
  .progress-bar{width:100%;height:5px;border-radius:6px;background:var(--bg-panel);margin-top:6px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg, var(--team-a), var(--gold));border-radius:6px;transition:width .35s ease;}

  /* ---------- Stage ---------- */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 0 10px;position:relative;}

  .timer-medallion{width:120px;height:120px;margin-bottom:-46px;z-index:3;position:relative;display:flex;align-items:center;justify-content:center;}
  .timer-medallion svg{transform:rotate(-90deg);}
  .timer-ring-bg{fill:none;stroke:var(--bg-panel-2);stroke-width:8;}
  .timer-ring-fg{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear, stroke .2s ease;}
  .timer-value{position:absolute;font-size:34px;font-weight:900;color:var(--text);}
  .timer-medallion.danger .timer-ring-fg{stroke:var(--danger);}
  .timer-medallion.danger .timer-value{color:var(--danger);}
  .timer-medallion.danger{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  @media (prefers-reduced-motion:reduce){.timer-medallion.danger{animation:none;}}

  .slide-card{
    width:100%;max-width:840px;background:var(--bg-panel);border:1px solid var(--line);
    border-radius:30px;padding:64px 46px 40px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:20px;min-height:300px;justify-content:center;
  }
  .slide-card.round-slide{background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));}
  .round-slide .round-big{font-size:44px;font-weight:900;color:var(--gold);}
  .round-slide .round-big-sub{font-size:18px;color:var(--muted);font-weight:500;}

  .slide-category{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 18px;border-radius:999px;background:var(--bg-panel-2);
    border:1px solid var(--line);color:var(--gold);font-weight:700;font-size:13px;outline:none;
  }
  .board-number-pill{color:var(--muted); font-weight:700;}
  .slide-question{font-size:28px;font-weight:800;line-height:1.5;max-width:640px;outline:none;min-height:1.4em;}
  .slide-question:empty::before{content:'اكتب نص السؤال هنا...';color:var(--muted);font-weight:500;}
  .slide-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px;}
  .option{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500;cursor:pointer;outline:none;text-align:center;}
  .option:empty::before{content:'اختيار...';color:var(--muted);}
  .option.selected{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset;}
  .option.correct{border-color:var(--team-a); background:var(--team-a-dim); color:var(--team-a);}
  .slide-answer-wrap{min-height:20px;}
  .slide-answer{font-size:15px;color:var(--team-a);font-weight:700;outline:none;display:none;}
  .slide-answer.editing-visible,.slide-answer.revealed{display:block;}
  .slide-answer:empty::before{content:'اكتب الإجابة الصحيحة هنا (كلمة أو كلمتين)...';color:var(--muted);font-weight:500;}

  .edit-mode .slide-category,.edit-mode .slide-question,.edit-mode .option,.edit-mode .slide-answer{
    box-shadow:inset 0 0 0 1px var(--gold);
  }

  .back-board-btn{
    margin-top:6px; background:transparent; border:1px solid var(--line); color:var(--muted);
    padding:7px 14px; border-radius:10px; font-family:var(--font); font-weight:700; font-size:13px; cursor:pointer;
  }
  .back-board-btn:hover{color:var(--gold); border-color:var(--gold);}

  /* ---------- Board (round 5) ---------- */
  .board-wrap{width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;}
  .board-tabs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px;}
  .board-tab{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:999px; font-family:var(--font); font-weight:700; font-size:14px; cursor:pointer;
  }
  .board-tab.active{background:var(--gold); color:#241C05; border-color:var(--gold);}
  .board-tab:hover{color:var(--text);}
  .board-grid{display:grid; grid-template-columns:repeat(4, 64px); gap:12px; justify-content:center;}
  .board-num{
    width:64px;height:64px; border-radius:16px; background:var(--bg-panel-2); border:1px solid var(--line);
    color:var(--text); font-size:22px; font-weight:900; font-family:var(--font); cursor:pointer;
  }
  .board-num:hover{border-color:var(--gold);}
  .board-num.used{background:var(--team-a-dim); border-color:var(--team-a); color:var(--team-a); opacity:.75;}

  /* ---------- Footer controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);}
  .control-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  button.ctrl{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:12px;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;}
  button.ctrl:hover{filter:brightness(1.2);}
  button.ctrl:active{filter:brightness(0.9);}
  button.ctrl.primary{background:var(--gold); color:#241C05; border-color:var(--gold);}
  button.ctrl.danger-btn{background:var(--danger); color:#fff; border-color:var(--danger);}
  button.ctrl.on{background:var(--team-a); color:#052A26; border-color:var(--team-a);}
  button.ctrl:disabled{opacity:.45; cursor:not-allowed;}

  .dur-input{width:56px;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 6px;text-align:center;font-family:var(--font);font-weight:700;font-size:14px;}
  .dur-presets{display:flex;gap:4px;}
  .dur-presets button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:12px;font-family:var(--font);cursor:pointer;}
  .dur-presets button:hover{color:var(--text); border-color:var(--gold);}

  .slide-counter{color:var(--muted); font-size:13px; font-weight:700; min-width:64px; text-align:center;}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;}

  @media (max-width:720px){
    .scoreboard{grid-template-columns:1fr; gap:8px;}
    .team-panel.a, .team-panel.b{border-radius:18px;}
    .slide-card{padding:56px 20px 30px;}
    .slide-question{font-size:22px;}
    .slide-options{grid-template-columns:1fr;}
    .controls{justify-content:center;}
    .board-grid{grid-template-columns:repeat(4, 1fr); width:100%; max-width:340px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="scoreboard">
    <div class="team-panel a">
      <input class="team-name" id="teamAName" value="الفريق الأول">
      <div class="score-row">
        <input class="score-value" id="teamAScore" type="number" value="0">
        <div class="score-btns">
          <button class="score-btn" data-team="a" data-delta="1">+</button>
          <button class="score-btn" data-team="a" data-delta="-1">−</button>
        </div>
      </div>
    </div>

    <div class="center-info">
      <div class="round-label" id="roundLabel">—</div>
      <div class="round-sub" id="roundSub">—</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="team-panel b">
      <input class="team-name" id="teamBName" value="الفريق الثاني">
      <div class="score-row">
        <div class="score-btns">
          <button class="score-btn" data-team="b" data-delta="1">+</button>
          <button class="score-btn" data-team="b" data-delta="-1">−</button>
        </div>
        <input class="score-value" id="teamBScore" type="number" value="0">
      </div>
    </div>
  </div>

  <main class="stage">
    <div class="timer-medallion" id="timerMedallion">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="timer-ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="timer-ring-fg" id="timerRing" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="timer-value" id="timerValue">20</div>
    </div>

    <div class="slide-card" id="slideCard"></div>

    <div class="hint">اضغط مسافة لبدء/إيقاف المؤقت، وأسهم يمين/يسار للتنقل بين الأسئلة</div>
    <div class="hint" id="saveHint">🔒 بيانات الأسئلة والسكور بتتحفظ تلقائيًا في متصفحك على هذا الجهاز</div>
  </main>

  <footer class="controls">
    <div class="control-group">
      <button class="ctrl" id="prevBtn">◂ السابق</button>
      <span class="slide-counter" id="slideCounter">1 / 1</span>
      <button class="ctrl" id="nextBtn">التالي ▸</button>
    </div>

    <div class="control-group">
      <button class="ctrl primary" id="startBtn">ابدأ ⏱</button>
      <button class="ctrl" id="pauseBtn">إيقاف مؤقت</button>
      <button class="ctrl" id="resetBtn">إعادة ضبط</button>
      <input class="dur-input" id="durationInput" type="number" min="3" max="180" value="20">
      <div class="dur-presets">
        <button data-dur="10">10ث</button>
        <button data-dur="20">20ث</button>
        <button data-dur="30">30ث</button>
        <button data-dur="60">60ث</button>
      </div>
    </div>

    <div class="control-group">
      <button class="ctrl" id="audienceBtn">🖥 شاشة الجمهور</button>
      <button class="ctrl" id="showAnswerBtn">إظهار الإجابة</button>
      <button class="ctrl" id="editModeBtn">تعديل ✎</button>
      <button class="ctrl" id="addSlideBtn">+ سؤال</button>
      <button class="ctrl danger-btn" id="deleteSlideBtn">حذف السؤال</button>
      <button class="ctrl" id="clearDataBtn">مسح البيانات المحفوظة</button>
    </div>
  </footer>

</div>

<!-- ================= Audience screen (written into the popup window) ================= -->
<template id="audienceTemplate">
<style>
  :root{
    --bg-deep:#15112F; --bg-panel:#201A4D; --bg-panel-2:#271F5E; --gold:#E8B54A;
    --team-a:#22C1B5; --team-a-dim:#12403C; --team-b:#F2924B; --danger:#E5484D;
    --text:#F5F3FC; --muted:#9D97C6; --line:rgba(245,243,252,0.12);
    --font:'Tajawal', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, #2A2266 0%, transparent 60%),
      radial-gradient(900px 500px at 105% 10%, #2A2266 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text); font-family:var(--font); cursor:pointer; user-select:none;
  }
  body.is-fs{cursor:none;}
  .aud{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:2.5vh;padding:3vh 3vw 4vh;}

  /* scoreboard */
  .aud-score{display:grid;grid-template-columns:1fr minmax(18vw,auto) 1fr;gap:2vw;align-items:stretch;}
  .aud-team{
    background:var(--bg-panel);border:1px solid var(--line);padding:1.8vh 2.2vw;
    display:flex;align-items:center;justify-content:space-between;gap:2vw;min-width:0;
  }
  .aud-team.a{border-radius:4vh 1.4vh 1.4vh 4vh;border-inline-start:.7vh solid var(--team-a);}
  .aud-team.b{border-radius:1.4vh 4vh 4vh 1.4vh;border-inline-end:.7vh solid var(--team-b);flex-direction:row-reverse;}
  .aud-team-name{font-size:clamp(18px,3.6vh,52px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .aud-team.a .aud-team-name{color:var(--team-a);}
  .aud-team.b .aud-team-name{color:var(--team-b);}
  .aud-team-score{font-size:clamp(44px,10vh,140px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .aud-team-score.bump{animation:bump .6s ease;}
  @keyframes bump{0%{transform:scale(1);}35%{transform:scale(1.25);color:var(--gold);}100%{transform:scale(1);}}
  .aud-round{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6vh;}
  .aud-round-title{font-size:clamp(18px,3.8vh,52px);font-weight:900;color:var(--gold);}
  .aud-round-sub{font-size:clamp(14px,2.6vh,34px);color:var(--muted);font-weight:700;}

  /* stage */
  .aud-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}
  .aud-timer{flex-shrink:0;width:21vh;height:21vh;margin-bottom:-8.5vh;z-index:2;position:relative;display:flex;align-items:center;justify-content:center;}
  .aud-timer.hidden{display:none;}
  .aud-timer svg{width:100%;height:100%;transform:rotate(-90deg);}
  .aud-ring-bg{fill:none;stroke:var(--bg-panel-2);stroke-width:8;}
  .aud-ring-fg{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear, stroke .2s ease;}
  .aud-timer-value{position:absolute;font-size:8.5vh;font-weight:900;font-variant-numeric:tabular-nums;}
  .aud-timer.danger .aud-ring-fg{stroke:var(--danger);}
  .aud-timer.danger .aud-timer-value{color:var(--danger);}
  .aud-timer.danger{animation:pulse 1s ease-in-out infinite;}
  .aud-timer.done{animation:none;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  .aud-card{
    width:min(92vw,1600px);background:var(--bg-panel);border:1px solid var(--line);border-radius:5vh;
    padding:12vh 4vw 5vh;text-align:center;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3.2vh;min-height:48vh;flex-shrink:0;
  }
  .aud-card.intro{background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));padding:6vh 4vw;}
  .aud-big{font-size:clamp(40px,11vh,150px);font-weight:900;color:var(--gold);line-height:1.2;}
  .aud-big.small{font-size:clamp(26px,5.5vh,72px);}
  .aud-big-sub{font-size:clamp(18px,4vh,54px);color:var(--muted);font-weight:500;}

  .aud-cat{
    display:inline-flex;gap:1vw;align-items:center;padding:1vh 2.4vw;border-radius:999px;
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--gold);font-weight:800;font-size:clamp(16px,3vh,40px);
  }
  .aud-cat .num{color:var(--muted);}
  .aud-question{font-size:clamp(26px,6vh,86px);font-weight:800;line-height:1.45;max-width:90%;white-space:pre-wrap;}
  .aud-options{display:grid;grid-template-columns:1fr 1fr;gap:2vh 1.6vw;width:min(84vw,1300px);}
  .aud-option{
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:2.4vh;padding:2.2vh 1.6vw;
    font-size:clamp(18px,3.8vh,52px);font-weight:700;transition:opacity .3s ease, background .3s ease;
  }
  .aud-option.selected{border-color:var(--gold);box-shadow:0 0 0 .4vh var(--gold) inset;}
  .aud-option.correct{border-color:var(--team-a);background:var(--team-a-dim);color:var(--team-a);box-shadow:0 0 0 .4vh var(--team-a) inset;}
  .aud-options.revealed .aud-option:not(.correct){opacity:.4;}
  .aud-answer{
    font-size:clamp(24px,5.4vh,76px);font-weight:900;color:var(--team-a);background:var(--team-a-dim);
    border:1px solid var(--team-a);border-radius:2.6vh;padding:1.6vh 3.4vw;animation:reveal .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes reveal{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}

  .aud-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vh 1vw;}
  .aud-tab{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--muted);padding:1.2vh 2vw;border-radius:999px;font-weight:800;font-size:clamp(16px,3vh,40px);}
  .aud-tab.active{background:var(--gold);color:#241C05;border-color:var(--gold);}
  .aud-grid{display:grid;grid-template-columns:repeat(4, 11vh);gap:2vh;justify-content:center;}
  .aud-num{width:11vh;height:11vh;border-radius:2.6vh;background:var(--bg-panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:900;}
  .aud-num.used{background:var(--team-a-dim);border-color:var(--team-a);color:var(--team-a);opacity:.6;}

  .aud-waiting{font-size:4vh;color:var(--muted);font-weight:700;}
  .aud-fs-hint{position:fixed;bottom:1.2vh;left:0;right:0;text-align:center;font-size:14px;color:var(--muted);opacity:.8;}
  body.is-fs .aud-fs-hint{display:none;}

  @media (prefers-reduced-motion:reduce){
    .aud-timer.danger,.aud-team-score.bump,.aud-answer{animation:none;}
  }
</style>

<div class="aud" id="audRoot">
  <div class="aud-score">
    <div class="aud-team a">
      <div class="aud-team-name" id="audTeamAName">الفريق الأول</div>
      <div class="aud-team-score" id="audTeamAScore">0</div>
    </div>
    <div class="aud-round">
      <div class="aud-round-title" id="audRoundTitle"></div>
      <div class="aud-round-sub" id="audRoundSub"></div>
    </div>
    <div class="aud-team b">
      <div class="aud-team-name" id="audTeamBName">الفريق الثاني</div>
      <div class="aud-team-score" id="audTeamBScore">0</div>
    </div>
  </div>

  <main class="aud-stage">
    <div class="aud-timer hidden" id="audTimer">
      <svg viewBox="0 0 120 120">
        <circle class="aud-ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="aud-ring-fg" id="audRing" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="aud-timer-value" id="audTimerValue"></div>
    </div>
    <div class="aud-card intro" id="audCard">
      <div class="aud-waiting">في انتظار شاشة التحكم...</div>
    </div>
  </main>
</div>
<div class="aud-fs-hint">اضغط على الشاشة (أو حرف F) للعرض بملء الشاشة</div>

<script>
(function(){
  "use strict";
  var RING_C = 2 * Math.PI * 52;
  function $(id){ return document.getElementById(id); }
  var ring = $('audRing');
  ring.style.strokeDasharray = RING_C;
  var lastSlideKey = null;
  var lastScores = { a:null, b:null };

  function mk(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function setScore(id, key, val){
    var e = $(id);
    if(lastScores[key] !== null && lastScores[key] !== val){
      e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump');
    }
    lastScores[key] = val;
    e.textContent = val;
  }

  function renderTimer(t, show){
    var box = $('audTimer');
    box.classList.toggle('hidden', !show);
    $('audTimerValue').textContent = t.remaining;
    var r = t.duration > 0 ? Math.max(0, t.remaining / t.duration) : 0;
    ring.style.strokeDashoffset = RING_C * (1 - r);
    box.classList.toggle('danger', t.remaining <= 5);
    box.classList.toggle('done', t.remaining <= 0);
  }

  function renderSlide(s){
    var card = $('audCard');
    card.innerHTML = '';
    card.className = 'aud-card' + (s.kind === 'question' ? '' : ' intro');

    if(s.kind === 'round'){
      card.appendChild(mk('div', 'aud-big', s.title));
      card.appendChild(mk('div', 'aud-big-sub', s.sub));

    } else if(s.kind === 'board'){
      card.appendChild(mk('div', 'aud-big small', 'اختر الفئة ثم رقم السؤال'));
      var tabs = mk('div', 'aud-tabs');
      s.cats.forEach(function(c){ tabs.appendChild(mk('div', 'aud-tab' + (c === s.activeCat ? ' active' : ''), c)); });
      card.appendChild(tabs);
      var grid = mk('div', 'aud-grid');
      s.numbers.forEach(function(n){ grid.appendChild(mk('div', 'aud-num' + (n.used ? ' used' : ''), n.n)); });
      card.appendChild(grid);

    } else {
      var cat = mk('div', 'aud-cat');
      cat.appendChild(mk('span', '', s.category));
      if(s.boardNumber){ cat.appendChild(mk('span', 'num', '• رقم ' + s.boardNumber)); }
      card.appendChild(cat);
      card.appendChild(mk('div', 'aud-question', s.question));

      if(s.options.length){
        var opts = mk('div', 'aud-options' + (s.answerShown ? ' revealed' : ''));
        s.options.forEach(function(o){
          if(!o.text) return;
          opts.appendChild(mk('div', 'aud-option' + (o.selected ? ' selected' : '') + (o.correct ? ' correct' : ''), o.text));
        });
        card.appendChild(opts);
      }
      var matchedOption = s.options.some(function(o){ return o.correct; });
      if(s.answerShown && s.answer && !matchedOption){
        card.appendChild(mk('div', 'aud-answer', s.answer));
      }
    }
  }

  function render(d){
    $('audTeamAName').textContent = d.teamA.name;
    $('audTeamBName').textContent = d.teamB.name;
    setScore('audTeamAScore', 'a', d.teamA.score);
    setScore('audTeamBScore', 'b', d.teamB.score);
    $('audRoundTitle').textContent = d.roundTitle;
    $('audRoundSub').textContent = d.roundSub;
    var key = JSON.stringify(d.slide);
    if(key !== lastSlideKey){ lastSlideKey = key; renderSlide(d.slide); }
    renderTimer(d.timer, d.slide.kind === 'question');
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if(d && d.type === 'e26-audience-state'){ render(d); }
  });

  // Keep talking to the control window (also reconnects if it gets reloaded)
  function hello(){
    try{ if(window.opener && !window.opener.closed){ window.opener.postMessage({ type:'e26-audience-hello' }, '*'); } }catch(err){}
  }
  hello();
  setInterval(hello, 1500);

  // Fullscreen
  function toggleFs(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); }
  }
  document.addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', function(){
    document.body.classList.toggle('is-fs', !!document.fullscreenElement);
  });

  // Forward the control shortcuts if this window has focus
  document.addEventListener('keydown', function(e){
    if(e.code === 'KeyF'){ toggleFs(); return; }
    if(e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
      e.preventDefault();
      try{ window.opener.postMessage({ type:'e26-audience-key', code:e.code }, '*'); }catch(err){}
    }
  });
})();
</script>
</template>

<script>
(function(){
  "use strict";

  // ---------- Round template ----------
  const CATS5 = ['كتاب مقدس','علوم','رياضة','تاريخ','قدرات ذهنية'];
  const CATS4 = ['علوم','رياضة','تاريخ','قدرات ذهنية'];

  function repeatCats(list, times){
    const out = [];
    for(let t=0;t<times;t++){ list.forEach(c=>out.push(c)); }
    return out;
  }

  const ROUND_CONFIG = [
    { id:1, title:'الجولة الأولى', sub:'أسئلة كتابية', type:'mcq', timerMode:'perQuestion',
      cats: Array(12).fill('كتاب مقدس') },
    { id:2, title:'الجولة الثانية', sub:'معلومات عامة', type:'text', timerMode:'perQuestion',
      cats: repeatCats(CATS4, 2) },
    { id:3, title:'الجولة الثالثة', sub:'أسئلة متنوعة', type:'text', timerMode:'continuous', blockDuration:60,
      cats: repeatCats(CATS5, 2) },
    { id:4, title:'الجولة الرابعة', sub:'سؤال من كل فئة', type:'text', timerMode:'perQuestion',
      cats: CATS5.slice() },
    { id:5, title:'عجلة الحظ', sub:'الجولة الأخيرة', type:'text', timerMode:'perQuestion', board:true,
      cats: repeatCats(CATS5, 8) },
  ];

  function buildDefaultSlides(){
    const slides = [];
    ROUND_CONFIG.forEach(r=>{
      slides.push({ kind:'round', roundId:r.id, title:r.title, sub:r.sub + ' — ' + r.cats.length + ' سؤال' });
      if(r.board){
        slides.push({ kind:'board', roundId:r.id, activeCat: CATS5[0] });
      }
      const catCounters = {};
      r.cats.forEach(cat=>{
        catCounters[cat] = (catCounters[cat]||0)+1;
        slides.push({
          kind:'question',
          roundId:r.id,
          category:cat,
          qtype:r.type,
          question:'',
          options: r.type === 'mcq' ? ['','','',''] : [],
          answer:'',
          boardNumber: r.board ? catCounters[cat] : null,
          visited:false
        });
      });
    });
    return slides;
  }

  // ---------- State ----------
  const state = {
    slides: buildDefaultSlides(),
    index: 0,
    duration: 20,
    remaining: 20,
    timerId: null,
    running: false,
    editMode: false,
    answerShown: false,
    selectedOption: null
  };

  // ---------- DOM refs ----------
  const el = {
    teamAName: document.getElementById('teamAName'),
    teamBName: document.getElementById('teamBName'),
    teamAScore: document.getElementById('teamAScore'),
    teamBScore: document.getElementById('teamBScore'),
    roundLabel: document.getElementById('roundLabel'),
    roundSub: document.getElementById('roundSub'),
    progressFill: document.getElementById('progressFill'),
    slideCard: document.getElementById('slideCard'),
    slideCounter: document.getElementById('slideCounter'),
    timerMedallion: document.getElementById('timerMedallion'),
    timerRing: document.getElementById('timerRing'),
    timerValue: document.getElementById('timerValue'),
    durationInput: document.getElementById('durationInput'),
    startBtn: document.getElementById('startBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetBtn: document.getElementById('resetBtn'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    showAnswerBtn: document.getElementById('showAnswerBtn'),
    editModeBtn: document.getElementById('editModeBtn'),
    addSlideBtn: document.getElementById('addSlideBtn'),
    deleteSlideBtn: document.getElementById('deleteSlideBtn'),
    clearDataBtn: document.getElementById('clearDataBtn'),
    audienceBtn: document.getElementById('audienceBtn'),
  };

  const RING_R = 52;
  const RING_CIRC = 2 * Math.PI * RING_R;
  el.timerRing.style.strokeDasharray = RING_CIRC;

  // ---------- Autosave (localStorage) ----------
  const STORAGE_KEY = 'matshat-alabaqera-state-v1';
  let saveTimer = null;
  function scheduleSave(){
    syncAudience();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 400);
  }
  function saveState(){
    try{
      const payload = {
        teamAName: el.teamAName.value,
        teamBName: el.teamBName.value,
        teamAScore: el.teamAScore.value,
        teamBScore: el.teamBScore.value,
        duration: state.duration,
        index: state.index,
        slides: state.slides
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }catch(err){ /* storage unavailable or full - continue without saving */ }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const payload = JSON.parse(raw);
      if(typeof payload.teamAName === 'string') el.teamAName.value = payload.teamAName;
      if(typeof payload.teamBName === 'string') el.teamBName.value = payload.teamBName;
      if(payload.teamAScore !== undefined) el.teamAScore.value = payload.teamAScore;
      if(payload.teamBScore !== undefined) el.teamBScore.value = payload.teamBScore;
      if(Array.isArray(payload.slides) && payload.slides.length === state.slides.length){
        state.slides = payload.slides;
      }
      if(typeof payload.duration === 'number'){
        state.duration = payload.duration;
        el.durationInput.value = payload.duration;
      }
      if(typeof payload.index === 'number' && payload.index >= 0 && payload.index < state.slides.length){
        state.index = payload.index;
      }
    }catch(err){ /* saved data unreadable - start fresh */ }
  }

  el.clearDataBtn.addEventListener('click', ()=>{
    if(!confirm('مسح كل البيانات المحفوظة في المتصفح والبدء من جديد؟')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(err){}
    location.reload();
  });

  // ---------- Score handling ----------
  [el.teamAName, el.teamBName].forEach(inp=>{
    inp.addEventListener('input', scheduleSave);
  });
  document.querySelectorAll('.score-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const team = btn.dataset.team;
      const delta = parseInt(btn.dataset.delta, 10);
      const input = team === 'a' ? el.teamAScore : el.teamBScore;
      const val = (parseInt(input.value,10) || 0) + delta;
      input.value = Math.max(0, val);
      scheduleSave();
    });
  });
  [el.teamAScore, el.teamBScore].forEach(inp=>{
    inp.addEventListener('input', syncAudience);
    inp.addEventListener('change', ()=>{
      const v = parseInt(inp.value,10);
      inp.value = isNaN(v) ? 0 : Math.max(0, v);
      scheduleSave();
    });
  });

  // ---------- Sound effects (synthesized, no external files needed) ----------
  let audioCtx = null;
  function ensureAudioCtx(){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      else if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
    }catch(err){ audioCtx = null; }
    return audioCtx;
  }
  function beep(freq, duration, type, startDelay, gainPeak){
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime + (startDelay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(gainPeak || 0.22, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }
  function playStartSound(){
    beep(523.25, 0.16, 'sine', 0, 0.22);
    beep(783.99, 0.22, 'sine', 0.15, 0.22);
  }
  function playTickSound(){
    beep(880, 0.09, 'square', 0, 0.16);
  }
  function playPulseSound(){
    beep(440, 0.08, 'sine', 0, 0.12);
  }
  function playTimeUpSound(){
    beep(220, 0.35, 'sawtooth', 0, 0.26);
    beep(164.81, 0.55, 'sawtooth', 0.12, 0.26);
  }

  // ---------- Timer ----------
  function renderTimer(){
    el.timerValue.textContent = state.remaining;
    const ratio = Math.max(0, state.remaining / state.duration);
    el.timerRing.style.strokeDashoffset = RING_CIRC * (1 - ratio);
    el.timerMedallion.classList.toggle('danger', state.remaining <= 5);
    syncAudience();
  }

  function startTimer(){
    if(state.running) return;
    if(state.remaining <= 0) state.remaining = state.duration;
    playStartSound();
    state.running = true;
    state.timerId = setInterval(()=>{
      state.remaining -= 1;
      if(state.remaining > 5){ playPulseSound(); }
      else if(state.remaining > 0 && state.remaining <= 5){ playTickSound(); }
      else if(state.remaining <= 0){ playTimeUpSound(); }
      renderTimer();
      if(state.remaining <= 0){ stopTimer(); }
    }, 1000);
  }
  function stopTimer(){
    state.running = false;
    if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  }
  function resetTimer(forcedDuration){
    stopTimer();
    if(typeof forcedDuration === 'number'){
      state.duration = forcedDuration;
      el.durationInput.value = forcedDuration;
    } else {
      state.duration = Math.max(3, parseInt(el.durationInput.value,10) || 20);
    }
    state.remaining = state.duration;
    renderTimer();
  }

  el.startBtn.addEventListener('click', startTimer);
  el.pauseBtn.addEventListener('click', stopTimer);
  el.resetBtn.addEventListener('click', ()=>resetTimer());
  el.durationInput.addEventListener('change', ()=>{ resetTimer(); scheduleSave(); });
  document.querySelectorAll('.dur-presets button').forEach(b=>{
    b.addEventListener('click', ()=>{ el.durationInput.value = b.dataset.dur; resetTimer(); scheduleSave(); });
  });

  // ---------- Slide helpers ----------
  function currentSlide(){ return state.slides[state.index]; }
  function roundCfgFor(id){ return ROUND_CONFIG.find(r=>r.id===id); }
  function findBoardIndex(roundId){ return state.slides.findIndex(x=>x.kind==='board' && x.roundId===roundId); }

  function renderRoundInfo(){
    const s = currentSlide();
    const cfg = roundCfgFor(s.roundId);
    el.roundLabel.textContent = cfg ? cfg.title : '';
    let sub = s.kind === 'round' ? s.sub : (s.category || '');
    if(cfg && cfg.timerMode === 'continuous'){
      sub += '  •  ⏱ مؤقت واحد مستمر لكل أسئلة الجولة (' + cfg.blockDuration + ' ث)';
    }
    el.roundSub.textContent = sub;
    el.slideCounter.textContent = (state.index+1) + ' / ' + state.slides.length;
    el.progressFill.style.width = (((state.index+1)/state.slides.length)*100) + '%';
  }

  function renderBoardSlide(s){
    const wrap = document.createElement('div');
    wrap.className = 'board-wrap';

    const tabs = document.createElement('div');
    tabs.className = 'board-tabs';
    CATS5.forEach(cat=>{
      const tab = document.createElement('button');
      tab.className = 'board-tab' + (s.activeCat === cat ? ' active' : '');
      tab.textContent = cat;
      tab.addEventListener('click', ()=>{ s.activeCat = cat; renderSlide(); scheduleSave(); });
      tabs.appendChild(tab);
    });
    wrap.appendChild(tabs);

    const grid = document.createElement('div');
    grid.className = 'board-grid';
    const questions = state.slides
      .filter(q=>q.kind==='question' && q.roundId===5 && q.category===s.activeCat)
      .sort((a,b)=>a.boardNumber-b.boardNumber);
    questions.forEach(q=>{
      const btn = document.createElement('button');
      btn.className = 'board-num' + (q.visited ? ' used' : '');
      btn.textContent = q.boardNumber;
      btn.addEventListener('click', ()=>{
        q.visited = true;
        goTo(state.slides.indexOf(q));
        scheduleSave();
      });
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);

    el.slideCard.appendChild(wrap);
  }

  function renderSlide(){
    const s = currentSlide();
    el.slideCard.innerHTML = '';
    el.slideCard.classList.toggle('round-slide', s.kind === 'round' || s.kind === 'board');
    el.slideCard.classList.toggle('edit-mode', state.editMode);

    if(s.kind === 'round'){
      const t = document.createElement('div');
      t.className = 'round-big';
      t.textContent = s.title;
      const sub = document.createElement('div');
      sub.className = 'round-big-sub';
      sub.textContent = s.sub;
      el.slideCard.appendChild(t);
      el.slideCard.appendChild(sub);

    } else if(s.kind === 'board'){
      const t = document.createElement('div');
      t.className = 'round-big';
      t.style.fontSize = '24px';
      t.textContent = 'اختر الفئة ثم رقم السؤال';
      el.slideCard.appendChild(t);
      renderBoardSlide(s);

    } else {
      const cat = document.createElement('div');
      cat.className = 'slide-category';
      cat.contentEditable = state.editMode;
      cat.textContent = s.category;
      cat.addEventListener('input', ()=>{ s.category = cat.textContent.trim(); scheduleSave(); });
      if(s.boardNumber){
        const pill = document.createElement('span');
        pill.className = 'board-number-pill';
        pill.textContent = '• رقم ' + s.boardNumber;
        cat.appendChild(pill);
      }
      el.slideCard.appendChild(cat);

      const q = document.createElement('div');
      q.className = 'slide-question';
      q.contentEditable = state.editMode;
      q.textContent = s.question;
      q.addEventListener('input', ()=>{ s.question = q.textContent; scheduleSave(); });
      el.slideCard.appendChild(q);

      if(s.qtype === 'mcq'){
        if(!state.editMode){
          const toggleBtn = document.createElement('button');
          toggleBtn.className = 'back-board-btn';
          toggleBtn.textContent = s.optionsShown ? 'إخفاء الاختيارات' : 'إظهار الاختيارات';
          toggleBtn.addEventListener('click', ()=>{
            s.optionsShown = !s.optionsShown;
            renderSlide();
          });
          el.slideCard.appendChild(toggleBtn);
        }

        const opts = document.createElement('div');
        opts.className = 'slide-options';
        if(!state.editMode && !s.optionsShown){ opts.style.display = 'none'; }
        s.options.forEach((opt, i)=>{
          const o = document.createElement('div');
          o.className = 'option';
          o.contentEditable = state.editMode;
          o.textContent = opt;
          if(!state.editMode && state.selectedOption === i) o.classList.add('selected');
          o.addEventListener('input', ()=>{ s.options[i] = o.textContent; scheduleSave(); });
          o.addEventListener('click', ()=>{
            if(state.editMode) return;
            document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
            o.classList.add('selected');
            state.selectedOption = i;
            syncAudience();
          });
          opts.appendChild(o);
        });
        el.slideCard.appendChild(opts);
      }

      const ansWrap = document.createElement('div');
      ansWrap.className = 'slide-answer-wrap';
      const ans = document.createElement('div');
      ans.className = 'slide-answer';
      ans.contentEditable = state.editMode;
      ans.textContent = s.answer;
      if(state.editMode) ans.classList.add('editing-visible');
      ans.addEventListener('input', ()=>{ s.answer = ans.textContent; scheduleSave(); });
      ansWrap.appendChild(ans);
      el.slideCard.appendChild(ansWrap);

      if(s.roundId === 5){
        const back = document.createElement('button');
        back.className = 'back-board-btn';
        back.textContent = '⟵ العودة للوحة';
        back.addEventListener('click', ()=>goTo(findBoardIndex(5)));
        el.slideCard.appendChild(back);
      }

      if(state.answerShown){
        const ansEl = el.slideCard.querySelector('.slide-answer');
        if(ansEl) ansEl.classList.add('revealed');
        if(s.qtype === 'mcq'){
          document.querySelectorAll('.option').forEach(o=>{
            const optText = o.textContent.replace('•','').trim();
            if(optText && optText === s.answer.trim()){ o.classList.add('correct'); }
          });
        }
      }
    }

    el.showAnswerBtn.textContent = state.answerShown ? 'إخفاء الإجابة' : 'إظهار الإجابة';
    renderRoundInfo();
    el.prevBtn.disabled = state.index === 0;
    el.nextBtn.disabled = state.index === state.slides.length - 1;
    el.showAnswerBtn.disabled = (s.kind === 'round' || s.kind === 'board');
    syncAudience();
  }

  function goTo(i){
    if(i < 0 || i >= state.slides.length) return;
    const prev = currentSlide();
    state.index = i;
    const next = currentSlide();
    const cfg = roundCfgFor(next.roundId);
    const isContinuous = cfg && cfg.timerMode === 'continuous';
    const continuedBlock = isContinuous && prev.kind === 'question' && next.kind === 'question' && prev.roundId === next.roundId;
    if(!continuedBlock){
      resetTimer(isContinuous ? cfg.blockDuration : undefined);
    }
    state.answerShown = false;
    state.selectedOption = null;
    if(next.kind === 'question'){ next.optionsShown = false; }
    renderSlide();
    scheduleSave();
  }

  el.prevBtn.addEventListener('click', ()=>goTo(state.index-1));
  el.nextBtn.addEventListener('click', ()=>goTo(state.index+1));

  el.showAnswerBtn.addEventListener('click', ()=>{
    const s = currentSlide();
    if(s.kind === 'round' || s.kind === 'board') return;
    state.answerShown = !state.answerShown;
    if(state.answerShown && s.qtype === 'mcq'){ s.optionsShown = true; }
    renderSlide();
  });

  el.editModeBtn.addEventListener('click', ()=>{
    state.editMode = !state.editMode;
    el.editModeBtn.classList.toggle('on', state.editMode);
    el.editModeBtn.textContent = state.editMode ? 'تم ✔' : 'تعديل ✎';
    renderSlide();
  });

  el.addSlideBtn.addEventListener('click', ()=>{
    const s = currentSlide();
    const roundId = s.roundId || ROUND_CONFIG[ROUND_CONFIG.length-1].id;
    const cfg = roundCfgFor(roundId) || ROUND_CONFIG[0];
    const newSlide = {
      kind:'question',
      roundId: cfg.id,
      category: s.category || cfg.cats[0],
      qtype: cfg.type,
      question:'',
      options: cfg.type === 'mcq' ? ['','','',''] : [],
      answer:'',
      boardNumber: null,
      visited:false
    };
    state.slides.splice(state.index+1, 0, newSlide);
    goTo(state.index+1);
    if(!state.editMode){ el.editModeBtn.click(); }
    scheduleSave();
  });

  el.deleteSlideBtn.addEventListener('click', ()=>{
    if(state.slides.length <= 1) return;
    if(!confirm('حذف هذا السؤال نهائيًا؟')) return;
    state.slides.splice(state.index,1);
    if(state.index >= state.slides.length) state.index = state.slides.length-1;
    goTo(state.index);
    scheduleSave();
  });

  // ---------- Audience screen (extended display) ----------
  const AUDIENCE_WIN_NAME = 'e26-audience-screen';
  let audienceWin = null;

  function audienceAlive(){
    try{ return !!(audienceWin && !audienceWin.closed); }catch(err){ return false; }
  }

  // Only what the audience is allowed to see: the answer is sent ONLY after "إظهار الإجابة"
  function buildAudienceSnapshot(){
    const s = currentSlide();
    const cfg = roundCfgFor(s.roundId);
    let slide;
    if(s.kind === 'round'){
      slide = { kind:'round', title:s.title, sub:s.sub };
    } else if(s.kind === 'board'){
      slide = {
        kind:'board', activeCat:s.activeCat, cats:CATS5.slice(),
        numbers: state.slides
          .filter(q=>q.kind==='question' && q.roundId===s.roundId && q.category===s.activeCat)
          .sort((a,b)=>a.boardNumber-b.boardNumber)
          .map(q=>({ n:q.boardNumber, used:!!q.visited }))
      };
    } else {
      const revealed = state.answerShown;
      const correctText = (s.answer || '').trim();
      const showOpts = s.qtype === 'mcq' && !!s.optionsShown;
      slide = {
        kind:'question',
        category: s.category || '',
        boardNumber: s.boardNumber || null,
        question: s.question || '',
        options: showOpts ? s.options.map((t,i)=>({
          text: (t || '').trim(),
          selected: state.selectedOption === i,
          correct: revealed && !!correctText && (t || '').trim() === correctText
        })) : [],
        answerShown: revealed,
        answer: revealed ? (s.answer || '') : ''
      };
    }
    return {
      type:'e26-audience-state',
      teamA:{ name: el.teamAName.value, score: parseInt(el.teamAScore.value,10) || 0 },
      teamB:{ name: el.teamBName.value, score: parseInt(el.teamBScore.value,10) || 0 },
      roundTitle: cfg ? cfg.title : '',
      roundSub: (s.kind !== 'round' && cfg) ? cfg.sub : '',
      slide,
      timer:{ remaining: state.remaining, duration: state.duration }
    };
  }

  function syncAudience(){
    if(!audienceAlive()) return;
    try{ audienceWin.postMessage(buildAudienceSnapshot(), '*'); }catch(err){}
  }

  function updateAudienceBtn(){
    const on = audienceAlive();
    el.audienceBtn.classList.toggle('on', on);
    el.audienceBtn.textContent = on ? '🖥 شاشة الجمهور ✔' : '🖥 شاشة الجمهور';
  }

  // Chrome/Edge: try to place the window on the second display automatically (asks permission once)
  async function moveToOtherScreen(w){
    try{
      if(!('getScreenDetails' in window)) return;
      const details = await window.getScreenDetails();
      const other = details.screens.find(sc => sc !== details.currentScreen);
      if(!other) return;
      w.moveTo(other.availLeft, other.availTop);
      w.resizeTo(other.availWidth, other.availHeight);
    }catch(err){ /* permission denied or unsupported - drag the window manually */ }
  }

  function openAudience(){
    if(audienceAlive()){ audienceWin.focus(); syncAudience(); return; }
    const w = window.open('', AUDIENCE_WIN_NAME, 'popup=yes,width=1280,height=720');
    if(!w){
      alert('المتصفح منع فتح شاشة الجمهور. اسمح بالنوافذ المنبثقة (Pop-ups) لهذه الصفحة وحاول تاني.');
      return;
    }
    audienceWin = w;
    let alreadyBuilt = false;
    try{ alreadyBuilt = !!w.document.getElementById('audRoot'); }catch(err){}
    if(!alreadyBuilt){
      const tpl = document.getElementById('audienceTemplate');
      w.document.open();
      w.document.write(
        '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
        '<title>ماتشات العباقرة — شاشة الجمهور</title>' +
        '<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">' +
        '</head><body>' + tpl.innerHTML + '</body></html>'
      );
      w.document.close();
      moveToOtherScreen(w);
    }
    try{ w.focus(); }catch(err){}
    syncAudience();
    updateAudienceBtn();
  }

  el.audienceBtn.addEventListener('click', openAudience);

  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'e26-audience-hello'){
      // also re-attaches the audience window after this page is refreshed
      if(e.source && e.source !== audienceWin){ audienceWin = e.source; updateAudienceBtn(); }
      syncAudience();
    } else if(d.type === 'e26-audience-key' && e.source === audienceWin){
      handleKey(d.code);
    }
  });
  setInterval(updateAudienceBtn, 1000);

  // ---------- Keyboard shortcuts ----------
  function handleKey(code){
    if(code === 'Space'){ state.running ? stopTimer() : startTimer(); }
    else if(code === 'ArrowLeft'){ goTo(state.index+1); }
    else if(code === 'ArrowRight'){ goTo(state.index-1); }
  }
  document.addEventListener('keydown', (e)=>{
    const tag = document.activeElement.tagName;
    const isEditing = document.activeElement.isContentEditable || tag === 'INPUT';
    if(isEditing) return;
    if(e.code === 'Space') e.preventDefault();
    handleKey(e.code);
  });

  // ---------- Init ----------
  loadState();
  resetTimer();
  renderSlide();
})();
</script>
</body>
</html>
